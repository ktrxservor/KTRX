name: Engine Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux
          - os: windows-latest
            asset: windows
          - os: macos-latest
            asset: macos
    steps:
      - uses: actions/checkout@v4
      - name: Install Perl for Windows OpenSSL build
        if: runner.os == 'Windows'
        uses: shogo82148/actions-setup-perl@v1
      - uses: dtolnay/rust-toolchain@stable
      - name: Build engine CLI
        run: cargo build --manifest-path engine/Cargo.toml --release --locked -p ktrx-cli
      - name: Package Linux binary
        if: matrix.asset == 'linux'
        run: tar -C engine/target/release -czf ktrx-linux.tar.gz ktrx
      - name: Package macOS binary
        if: matrix.asset == 'macos'
        run: tar -C engine/target/release -czf ktrx-macos.tar.gz ktrx
      - name: Package Windows binary
        if: matrix.asset == 'windows'
        shell: pwsh
        run: Compress-Archive -Path engine/target/release/ktrx.exe -DestinationPath ktrx-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ktrx-${{ matrix.asset }}
          path: ktrx-${{ matrix.asset }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ktrx-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
