name: Engine Release

# The released binaries are self-contained: nothing has to be installed to run them.
#   Linux    static musl binary (no glibc, no OpenSSL)
#   Windows  static C runtime (.cargo/config.toml), OpenSSL built in
#   macOS    OpenSSL built in; only system libraries and frameworks are linked
# On every platform TLS verification uses the machine's CA certificates, and falls back to
# Mozilla's roots embedded in the binary when the machine has none.
#
# A tag v* builds and publishes a release. A push to a release-test/* branch runs the same
# builds and checks without publishing anything.

on:
  push:
    tags:
      - "v*"
    branches:
      - "release-test/**"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            asset: windows
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            asset: macos
            target: aarch64-apple-darwin
            deployment: "11.0"
          - os: macos-15-intel
            asset: macos-intel
            target: x86_64-apple-darwin
            deployment: "10.15"
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Perl for Windows OpenSSL build
        if: runner.os == 'Windows'
        uses: shogo82148/actions-setup-perl@v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig and cargo-zigbuild (static Linux build)
        if: runner.os == 'Linux'
        run: |
          python3 -m venv "$HOME/zigenv"
          "$HOME/zigenv/bin/pip" install ziglang cargo-zigbuild
          echo "$HOME/zigenv/bin" >> "$GITHUB_PATH"

      - name: Build engine CLI (Linux, static musl)
        if: runner.os == 'Linux'
        run: cargo zigbuild --manifest-path engine/Cargo.toml --release --locked -p ktrx-cli --target ${{ matrix.target }}
      - name: Build engine CLI
        if: runner.os != 'Linux'
        run: cargo build --manifest-path engine/Cargo.toml --release --locked -p ktrx-cli --target ${{ matrix.target }}

      - name: Locate the binary
        shell: bash
        run: |
          bin="engine/target/${{ matrix.target }}/release/ktrx"
          [ "${{ runner.os }}" = "Windows" ] && bin="$bin.exe"
          echo "KTRX_BIN=$bin" >> "$GITHUB_ENV"

      # ---- portability: the binary must not depend on anything a clean machine lacks ----
      - name: Check dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          file "$KTRX_BIN"
          file "$KTRX_BIN" | grep -E "statically linked|static-pie linked"
      - name: Check dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          otool -L "$KTRX_BIN"
          bad="$(otool -L "$KTRX_BIN" | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/)' || true)"
          if [ -n "$bad" ]; then echo "Non-system libraries linked:"; echo "$bad"; exit 1; fi
          otool -l "$KTRX_BIN" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | grep -E "minos|version"
      - name: Check dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -like '*Hostx64*x64*' } | Select-Object -First 1
          $imports = & $dumpbin.FullName /dependents $env:KTRX_BIN | Out-String
          Write-Host $imports
          if ($imports -match '(?i)vcruntime|msvcp|api-ms-win-crt|ucrtbase|libssl|libcrypto') {
            throw "ktrx.exe depends on a runtime that a clean machine may not have"
          }

      # ---- smoke tests: run it, fetch from the registry over HTTPS, verify TLS in a tool ----
      - name: Smoke test
        shell: bash
        run: |
          set -e
          "$KTRX_BIN" --version
          "$KTRX_BIN" capabilities > /dev/null
          tools="$RUNNER_TEMP/tools"
          "$KTRX_BIN" install thoth --dir "$tools"
          "$KTRX_BIN" install argus --dir "$tools"
          out="$("$KTRX_BIN" run "$tools/K~THOTH.tool" --encode ok)"
          grep -q "b2s=" <<<"$out"
          out="$("$KTRX_BIN" run -y "$tools/K~ARGUS.tool" https://ktrx-site.tiagoantunes2009.workers.dev)"
          grep -q '"verified": true' <<<"$out"
          echo "TLS verification through a tool works."
          # A closed pipe must not make the CLI panic (exit 101).
          "$KTRX_BIN" capabilities | head -1 > /dev/null
          if [ "$RUNNER_OS" != "Windows" ]; then
            # Only the embedded Mozilla roots: proves the fallback verifies a real chain.
            out="$(KTRX_EMBEDDED_CA=1 "$KTRX_BIN" run -y "$tools/K~ARGUS.tool" https://ktrx-site.tiagoantunes2009.workers.dev)"
            grep -q '"verified": true' <<<"$out"
            echo "TLS verification with the embedded roots works."
          fi
      - name: Smoke test on a machine with no CA certificates (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist && cp "$KTRX_BIN" dist/ktrx
          # busybox has no OpenSSL, no glibc and no /etc/ssl: the worst case.
          docker run --rm -v "$PWD/dist:/x:ro" busybox sh -c '
            ls /etc/ssl/certs 2>/dev/null | head -1 || echo "(no CA bundle here, as intended)"
            /x/ktrx --version
            /x/ktrx install thoth --dir /tmp/t
            /x/ktrx install argus --dir /tmp/t
            /x/ktrx run -y /tmp/t/K~ARGUS.tool https://ktrx-site.tiagoantunes2009.workers.dev | grep "\"verified\": true"
          '

      - name: Package Linux binary
        if: matrix.asset == 'linux'
        run: tar -C "$(dirname "$KTRX_BIN")" -czf ktrx-linux.tar.gz ktrx
      - name: Package macOS binary
        if: runner.os == 'macOS'
        run: tar -C "$(dirname "$KTRX_BIN")" -czf ktrx-${{ matrix.asset }}.tar.gz ktrx
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path $env:KTRX_BIN -DestinationPath ktrx-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ktrx-${{ matrix.asset }}
          path: ktrx-${{ matrix.asset }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ktrx-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
      - name: Publish binaries to the KTRX registry
        env:
          KTRX_REGISTRY_KEY: ${{ secrets.KTRX_REGISTRY_KEY }}
          KTRX_REGISTRY_URL: https://ktrx-site.tiagoantunes2009.workers.dev
        run: |
          if [ -z "$KTRX_REGISTRY_KEY" ]; then
            echo "KTRX_REGISTRY_KEY is not set; skipping registry upload."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          for file in release-assets/*; do
            name="$(basename "$file")"
            platform="${name#ktrx-}"; platform="${platform%%.*}"
            curl --fail-with-body -sS -X POST \
              "$KTRX_REGISTRY_URL/api/engine?version=$version&platform=$platform&filename=$name" \
              -H "Authorization: Bearer $KTRX_REGISTRY_KEY" --data-binary @"$file"
            echo
          done
