name: Installers

# Runs the one-line installers of the KTRX site exactly as a user would, on clean machines:
# fresh GitHub runners and bare containers (Alpine, Debian, Fedora, Ubuntu). Checks that ktrx
# lands in the PATH of a new shell, starts, installs a tool from the registry and runs it.
# It tests what the site serves right now, so run it after publishing a release.

on:
  workflow_dispatch:
  push:
    branches:
      - "installer-check/**"
  schedule:
    - cron: "17 6 * * 1"

env:
  SITE: https://ktrx-site.tiagoantunes2009.workers.dev

jobs:
  unix:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    steps:
      - name: Install with the one-liner (fresh HOME, no PATH entry)
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          curl -fsSL "$SITE/install.sh" | SHELL=/bin/bash sh
      - name: A new login shell finds ktrx and runs a tool
        run: |
          export HOME="$RUNNER_TEMP/home"
          env -i HOME="$HOME" PATH=/usr/bin:/bin bash -lc '
            set -e
            command -v ktrx
            ktrx --version
            ktrx install thoth
            ktrx run thoth --encode ok | grep -q "b2s="
          '

  containers:
    name: install.sh in ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: alpine:latest            # busybox sh + busybox wget, no curl, no bash
            prepare: "true"
          - image: debian:stable-slim       # nothing but curl added
            prepare: "apt-get update -qq && apt-get install -y -qq curl >/dev/null"
          - image: fedora:latest
            prepare: "true"
          - image: ubuntu:20.04             # old glibc
            prepare: "apt-get update -qq && apt-get install -y -qq curl >/dev/null"
    steps:
      - run: |
          docker run --rm -e SITE "${{ matrix.image }}" sh -c '
            set -e
            ${{ matrix.prepare }}
            if command -v curl >/dev/null; then curl -fsSL "$SITE/install.sh" | sh; else wget -qO- "$SITE/install.sh" | sh; fi
            . "$HOME/.profile"
            ktrx --version
            ktrx install argus
            ktrx run -y argus https://example.com | grep "\"verified\": true"
          '

  windows:
    name: install.ps1 (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]       # Windows PowerShell 5.1 (as on a new PC) and PowerShell 7
    steps:
      - name: Write the test scripts
        shell: pwsh
        run: |
          @'
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'profile'
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          irm "$env:SITE/install.ps1" | iex
          if (-not (Test-Path "$env:USERPROFILE\.ktrx\bin\ktrx.exe")) { throw 'ktrx.exe not installed' }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($userPath -notlike "*$env:USERPROFILE\.ktrx\bin*") { throw 'user PATH not updated' }
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\install.ps1"
          @'
          $ErrorActionPreference = 'Stop'
          # A new process: PATH comes from the registry, as in a new terminal.
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine')
          ktrx --version
          if ($LASTEXITCODE -ne 0) { throw 'ktrx --version failed' }
          ktrx install argus
          if ($LASTEXITCODE -ne 0) { throw 'ktrx install failed' }
          $out = ktrx run -y argus https://example.com | Out-String
          if ($out -notmatch '"verified": true') { Write-Host $out; throw 'TLS verification failed' }
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\check.ps1"
      - name: Install with the one-liner
        shell: pwsh
        run: '& ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\install.ps1"; if ($LASTEXITCODE) { exit $LASTEXITCODE }'
      - name: A new process finds ktrx and runs a tool
        shell: pwsh
        run: '& ${{ matrix.shell }} -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\check.ps1"; if ($LASTEXITCODE) { exit $LASTEXITCODE }'
