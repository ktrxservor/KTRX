id = "tls-inspector"
name = "K~ARGUS"
description = "Verify TLS connectivity and inspect the HTTPS response for a user-selected target."
version = "1.0.1"
author = "KTRX"
api_version = "1"
permissions = ["network"]
examples = ["ktrx run 'tools/ARGUS ( TLS-Inspector )/K~ARGUS.tool' https://example.com"]
[[arguments]]
name = "url"
description = "HTTPS URL to inspect after network approval."
positional = true
required = true
