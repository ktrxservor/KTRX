id = "json-inspector"
name = "K~METIS"
description = "Validate, pretty-print, or compact JSON and summarize its top-level structure."
version = "1.0.0"
author = "KTRX"
api_version = "1"
permissions = []
examples = ["ktrx run 'tools/METIS ( JSON-Inspector )/K~METIS.tool' --pretty '{\"ok\":true}'", "ktrx run 'tools/METIS ( JSON-Inspector )/K~METIS.tool' --compact '{ \"ok\": true }'"]
[[arguments]]
name = "json"
description = "JSON document to inspect or format."
positional = true
required = true
[[arguments]]
name = "pretty"
description = "Output indented JSON (default)."
value_type = "boolean"
[[arguments]]
name = "compact"
description = "Output compact JSON."
value_type = "boolean"
