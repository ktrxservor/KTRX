id = "http-inspector"
name = "HTTP Inspector"
description = "Inspect status and response headers for an allowed HTTP or HTTPS URL."
version = "1.0.0"
author = "KTRX"
api_version = "1"
permissions = ["network"]
examples = ["ktrx run http-inspector.tool https://example.com"]
[[arguments]]
name = "url"
description = "HTTP or HTTPS URL to inspect after network approval."
positional = true
required = true
