id = "jwt-inspector"
name = "JWT Inspector"
description = "Decode JWT header and claims locally and report common time claims. Does not verify signatures."
version = "1.0.0"
author = "KTRX"
api_version = "1"
permissions = []
examples = ["ktrx run jwt-inspector.tool eyJhbGciOiJub25lIn0.eyJzdWIiOiIxMjMifQ.sig"]
[[arguments]]
name = "token"
description = "Compact JWT token to inspect."
positional = true
required = true
