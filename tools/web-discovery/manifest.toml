id = "web-discovery"
name = "Web Discovery"
description = "Découverte prudente de chemins web à partir d’une liste de mots, inspirée de Gobuster."
version = "1.0.1"
author = "KTRX"
api_version = "1"
execution_timeout_seconds = 0
permissions = ["network", "file-read"]
examples = ["ktrx run web-discovery.tool https://example.com --max-words 500"]

[[arguments]]
name = "url"
description = "URL HTTP(S) de base de la cible à tester après accord réseau."
value_type = "string"
required = true
positional = true

[[arguments]]
name = "file"
description = "Fichier de mots local facultatif (un chemin par ligne)."
value_type = "path"
required = false
positional = false

[[arguments]]
name = "extensions"
description = "Extensions facultatives séparées par des virgules, par exemple php,txt."
value_type = "string"
required = false
positional = false

[[arguments]]
name = "max-words"
description = "Nombre maximal de chemins générés, de 1 à 5000."
value_type = "integer"
required = false
positional = false
default = 500

[[arguments]]
name = "include-status"
description = "Codes HTTP à afficher, séparés par des virgules."
value_type = "string"
required = false
positional = false
default = "200,204,301,302,307,401,403"
