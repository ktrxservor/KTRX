name = "ktrx-site"
main = "src/index.ts"
compatibility_date = "2026-11-18"

[assets]
directory = "./public"
binding = "ASSETS"
# The installers go through the Worker, which serves them as UTF-8 text.
run_worker_first = ["/install.sh", "/install.ps1", "/install-dev.sh", "/install-dev.ps1"]

[[r2_buckets]]
binding = "TOOLS_BUCKET"
bucket_name = "ktrx-tools"

[[d1_databases]]
binding = "DB"
database_name = "ktrx-catalog"
database_id = "ca2c1b42-6377-4976-aeef-e422e0c0ff9c"

[observability]
enabled = true
