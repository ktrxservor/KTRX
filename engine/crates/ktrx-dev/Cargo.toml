[package]
name = "ktrx-dev"
description = "KTRX team tool: create, check and publish tools to the KTRX registry."
version.workspace = true
edition.workspace = true

[[bin]]
name = "ktrx-dev"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ktrx-core = { path = "../ktrx-core" }
ktrx-runtime = { path = "../ktrx-runtime" }
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
zip.workspace = true
native-tls = "0.2"
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rpassword = "7"

[target.'cfg(target_os = "linux")'.dependencies]
webpki-root-certs = "1"
