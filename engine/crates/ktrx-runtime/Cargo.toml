[package]
name = "ktrx-runtime"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
ktrx-core = { path = "../ktrx-core" }
wasmtime.workspace = true
wasmtime-wasi.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

# OpenSSL is built from source and linked statically on every platform, so the released
# binaries need no OpenSSL installed (macOS has none, Windows ships its own, and the Linux
# build is a static musl binary).
openssl = { version = "0.10", features = ["vendored"] }

# A vendored OpenSSL has no CA bundle of its own. Outside Windows (which reads the machine's
# certificate stores) the system bundle is located at run time, and Mozilla's root list is the
# fallback on a machine that has none (minimal containers, bare installs).
# Mozilla's public root list, embedded: the fallback on Unix machines without a CA bundle,
# and added to the machine's stores on Windows (a fresh Windows does not hold every root).
webpki-root-certs = "1"

[target.'cfg(not(windows))'.dependencies]
openssl-probe = "0.1"

[target.'cfg(windows)'.dependencies]
schannel = "0.1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }
