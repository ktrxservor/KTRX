[workspace]
resolver = "2"
members = ["crates/ktrx-cli", "crates/ktrx-core", "crates/ktrx-runtime", "crates/ktrx-sdk"]
exclude = ["tests/host-probe"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["KTRX contributors"]

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
wasmtime = { version = "50.0", default-features = false, features = ["anyhow", "component-model", "cranelift", "runtime", "std", "wit-parser"] }
wasmtime-wasi = { version = "50.0", default-features = false, features = ["p2"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
